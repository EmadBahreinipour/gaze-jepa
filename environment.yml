# environment.yml — Conda environment for GazeJEPA
# Create with:  conda env create -f environment.yml
# Activate:     conda activate gaze-jepa

name: gaze-jepa
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.0
  - torchvision>=0.15

  # Scientific
  - numpy
  - scipy
  - matplotlib
  - pillow
  - pandas
  - scikit-learn

  # Config & logging
  - pyyaml
  - tqdm

  # Notebook
  - jupyter
  - ipykernel
  - ipywidgets

  # Dev tools
  - pip

  - pip:
      # Vision / eye-tracking (not on conda)
      - opencv-python-headless
      - multimatch_gaze   # canonical Dewhurst-2012 MultiMatch (audit §4.4)
      - einops            # used by Arash's saliency models
