# environment.yml — Conda environment for GazeJEPA
# Create with:  conda env create -f environment.yml
# Activate:     conda activate gaze-jepa

name: gaze-jepa
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.0
  - torchvision>=0.15

  # Scientific
  - numpy<2          # torch 2.2.x ABI requires numpy 1.x
  - scipy
  - matplotlib
  - pillow
  - pandas
  - scikit-learn

  # Config & logging
  - pyyaml
  - tqdm

  # Notebook
  - jupyter
  - ipykernel
  - ipywidgets

  # Dev tools
  - pip

  - pip:
      # Vision / eye-tracking (not on conda)
      - opencv-contrib-python-headless   # ships cv2.saliency for SpectralResidualSaliency
      - multimatch_gaze   # canonical Dewhurst-2012 MultiMatch
      - einops            # used by Arash's saliency models
      - transformers>=4.38 # IJepaModel (facebook/ijepa_vith14_1k)
