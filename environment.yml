# environment.yml — Conda environment for GazeJEPA
# Create with:  conda env create -f environment.yml
# Activate:     conda activate gaze-jepa

name: gaze-jepa
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch>=2.0
  - torchvision>=0.15

  # Scientific
  - numpy<2          # torch 2.2.x ABI requires numpy 1.x
  - scipy
  - matplotlib
  - pillow
  - pandas
  - scikit-learn

  # Config & logging
  - pyyaml
  - tqdm

  # Notebook
  - jupyter
  - ipykernel
  - ipywidgets

  # Dev tools
  - pip

  - pip:
      - opencv-contrib-python-headless 
      - multimatch_gaze  
      - einops           
      - transformers>=4.38
